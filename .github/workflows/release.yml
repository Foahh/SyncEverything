name: Release SyncEverything

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_draft_release:
        description: "Create a draft GitHub Release from this workflow run"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows
            runner: windows-latest
            bundles: nsis
          - target: macos-arm64
            os: macos
            runner: macos-latest
            bundles: dmg
          - target: linux-x64
            os: linux
            runner: ubuntu-22.04
            bundles: deb,appimage

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tauri v2 Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            patchelf \
            libfuse2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies and run checks
        working-directory: crates/relay-desktop
        run: |
          bun install --frozen-lockfile
          bun run format:check
          bun run lint
          bun test

      - name: Build SyncEverything Desktop installers
        working-directory: crates/relay-desktop
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bun run tauri build --bundles ${{ matrix.bundles }} -- --locked

      - name: Build relay-daemon CLI binary
        run: cargo build --release --locked -p relay-daemon

      - name: Stage Windows release assets
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-staging | Out-Null
          $installers = Get-ChildItem -Path "target/release/bundle/nsis/*.exe" -ErrorAction Stop
          foreach ($f in $installers) {
            Copy-Item $f.FullName -Destination "release-staging/"
          }
          Compress-Archive -Path "target/release/relay-daemon.exe" -DestinationPath "release-staging/relay-daemon-${{ matrix.target }}.zip" -Force
          Get-ChildItem release-staging

      - name: Stage macOS and Linux release assets
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-staging

          if [ "${{ matrix.os }}" = "macos" ]; then
            files=(target/release/bundle/dmg/*.dmg)
            test "${#files[@]}" -gt 0
            cp "${files[@]}" release-staging/
          else
            deb_files=(target/release/bundle/deb/*.deb)
            appimage_files=(target/release/bundle/appimage/*.AppImage)
            test "${#deb_files[@]}" -gt 0
            test "${#appimage_files[@]}" -gt 0
            cp "${deb_files[@]}" "${appimage_files[@]}" release-staging/
          fi

          tar -czf "release-staging/relay-daemon-${{ matrix.target }}.tar.gz" -C target/release relay-daemon
          ls -lh release-staging

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synceverything-${{ matrix.target }}
          path: release-staging/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_draft_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          rm -f SHA256SUMS.txt
          sha256sum -- * > /tmp/SHA256SUMS.txt
          mv /tmp/SHA256SUMS.txt SHA256SUMS.txt
          ls -lh

          cat <<'EOF' > /tmp/release-notes.md
          ### Downloads

          - **Desktop App**: Windows x64 (`.exe` NSIS installer), macOS Apple Silicon (`.dmg`), Linux x64 (`.deb` and `.AppImage`)
          - **Headless CLI / MCP Server (`relay-daemon`)**: Standalone archives for Windows, macOS, and Linux
          - **Checksums**: Verified in `SHA256SUMS.txt`

          > **Unsigned builds:** Installers are not yet code-signed. On macOS, if Gatekeeper blocks first launch, run `xattr -cr /Applications/SyncEverything.app` after dragging the app into `/Applications`.
          EOF

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            extra_flags=()
            if [[ "$tag" == *-* ]]; then
              extra_flags+=(--prerelease)
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$tag" ./* --repo "$GITHUB_REPOSITORY" --clobber
            else
              gh release create "$tag" ./* \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "SyncEverything ${tag}" \
                --notes-file /tmp/release-notes.md \
                --generate-notes \
                "${extra_flags[@]}"
            fi
          else
            tag="draft-${GITHUB_SHA:0:12}"
            gh release create "$tag" ./* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --prerelease \
              --title "SyncEverything Draft (${GITHUB_SHA:0:12})" \
              --notes-file /tmp/release-notes.md
          fi
