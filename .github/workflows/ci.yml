name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust test & workspace check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tracked desktop dist placeholder exists
        run: test -f crates/relay-desktop/dist/.gitkeep

      - name: Install Tauri v2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup uv for sandbox tests
        uses: astral-sh/setup-uv@v5

      - name: Run relay-core and relay-daemon tests
        run: cargo test --locked -p relay-core -p relay-daemon

      - name: Test desktop workspace and MCP file handling
        run: cargo test --locked -p relay-desktop --lib

      - name: Check full Rust workspace
        run: cargo check --locked --workspace

  desktop-frontend:
    name: Desktop frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/relay-desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tracked dist/.gitkeep before build
        working-directory: .
        run: git ls-files --error-unmatch crates/relay-desktop/dist/.gitkeep

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint frontend
        run: bun run lint

      - name: Run frontend tests
        run: bun test

      - name: Build desktop frontend
        run: bun run build

      - name: Verify dist/.gitkeep restoration after Vite build
        working-directory: .
        run: |
          git restore --worktree -- crates/relay-desktop/dist/.gitkeep
          test -f crates/relay-desktop/dist/.gitkeep

  eval-tests:
    name: Evaluation harness unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Run eval scoring unit tests
        run: uv run python -m unittest discover -s experiments/eval -p "test_*.py"

      - name: Run benchmark evaluation unit tests
        run: uv run python -m unittest discover -s experiments/bench/results -p "test_*.py"
