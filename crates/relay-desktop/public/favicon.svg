<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="se-tile-bg" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#252E3D" />
      <stop offset="48%" stop-color="#151B25" />
      <stop offset="100%" stop-color="#0C1017" />
    </linearGradient>
    <radialGradient id="se-tile-sheen" cx="30%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="se-tile-rim" x1="256" y1="16" x2="256" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="se-silver" x1="140" y1="104" x2="368" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="se-teal" x1="152" y1="396" x2="368" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="55%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Obsidian graphite squircle tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#se-tile-bg)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#se-tile-sheen)" />
  <rect
    x="18"
    y="18"
    width="476"
    height="476"
    rx="110"
    stroke="url(#se-tile-rim)"
    stroke-width="3.5"
  />

  <!-- Upper silver-white relay arc: top-right device node -> sweeps left -> right-pointing arrow -->
  <path
    d="M 346 156 A 104 104 0 1 0 256 312 L 264 312"
    stroke="url(#se-silver)"
    stroke-width="40"
    stroke-linecap="butt"
  />
  <circle cx="346" cy="156" r="32" fill="url(#se-silver)" />
  <path d="M 248 264 L 304 312 L 248 360 Z" fill="url(#se-silver)" />

  <!-- Lower electric teal-emerald relay arc (exact 180° rotational symmetry around 256,256) -->
  <g transform="rotate(180 256 256)">
    <path
      d="M 346 156 A 104 104 0 1 0 256 312 L 264 312"
      stroke="url(#se-teal)"
      stroke-width="40"
      stroke-linecap="butt"
    />
    <circle cx="346" cy="156" r="32" fill="url(#se-teal)" />
    <path d="M 248 264 L 304 312 L 248 360 Z" fill="url(#se-teal)" />
  </g>
</svg>
