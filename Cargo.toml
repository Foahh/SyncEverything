[workspace]
resolver = "3"
members = [
    "crates/relay-core",
    "crates/relay-daemon",
    "crates/relay-desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
# Shared internal crate
relay-core = { path = "crates/relay-core" }

# Async runtime & concurrency
tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3.34"

# P2P QUIC transport & content-addressed blobs
iroh = "1.5.0"
iroh-blobs = { version = "0.105.0", features = ["fs-store"] }
blake3 = "1.8.7"

# Official Rust MCP SDK (v3.11) + HTTP server
rmcp = { version = "3.11.0", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
    "elicitation",
    "schemars",
] }
axum = "0.8.9"
schemars = "1.2.3"

# Persistence & graph engine
sqlx = { version = "0.9.1", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "sqlite-bundled",
    "chrono",
    "uuid",
    "json",
    "migrate",
] }
petgraph = { version = "0.8.3", features = ["serde-1"] }

# Serialization, config, identifiers, HTTP client
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
uuid = { version = "1.29.3", features = ["v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

# CLI, logging & error handling
clap = { version = "4.6.9", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
thiserror = "2.0.21"
anyhow = "1.0.104"

# Tauri v2 + Specta v2 strict version pins
tauri = { version = "2.12.7", features = [] }
tauri-build = { version = "2.7.6", features = [] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28", features = ["derive", "function", "chrono", "uuid", "serde_json"] }
specta-typescript = "0.0.15"
rfd = "0.18.0"
