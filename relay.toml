[project]
repo_id = "relay"
name = "SyncEverything (Relay Monorepo)"
smoke_preset = "check"

[presets.check]
description = "Compile-check all Rust crates in the workspace"
program = "cargo"
args = ["check", "--workspace"]
timeout_secs = 300
allowed_params = []

[presets.test_core]
description = "Run unit & integration tests for relay-core and relay-daemon"
program = "cargo"
args = ["test", "-p", "relay-core", "-p", "relay-daemon"]
timeout_secs = 300
allowed_params = []

[presets.test]
description = "Run workspace Rust tests (excluding desktop GUI crate)"
program = "cargo"
args = ["test", "--workspace", "--exclude", "relay-desktop"]
timeout_secs = 300
allowed_params = []
